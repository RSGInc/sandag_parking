[project]
name = "sandag-parking"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nick Fournier", email = "nick.fournier@rsginc.com" }
]
dependencies = [
    "geopandas>=0.14.2",
    "folium>=0.15.1",
    "alphashape>=1.3.1",
    "networkx>=3.2.1",
    "geonetworkx>=0.5.3",
    "tqdm>=4.66.1",
    "seaborn>=0.13.1",
    "osmnx>=1.8.1",
    "numpy>=1.26.3",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.2",
    "statsmodels>=0.14.1",
    "pandas>=2.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parking"]